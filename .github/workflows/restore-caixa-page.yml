name: restore-caixa-page
on:
  push:
    branches:
      - cursor/caixa-page-completa-690d
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verbatim CaixaPage
        run: bash .restore/apply.sh
